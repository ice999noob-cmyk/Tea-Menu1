<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Warm Teapot & Bakery Menu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Warm Cream Background */
      background-color: #faf3e0; 
      margin: 0;
      padding: 15px;
      /* Deep Brown Text */
      color: #3e2723; 
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      padding: 25px 0 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 1.7rem;
      /* Deep Caramel Brown Header */
      color: #795548; 
      font-weight: 800;
    }
    .header p {
      margin: 5px 0 0;
      /* Slightly muted warm brown */
      color: #8d6e63; 
      font-size: 0.95rem;
    }

    /* Warm Category Filter Buttons */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .filter-btn {
      /* Bright White Button */
      background-color: #ffffff; 
      /* Light Tan Border */
      border: 2px solid #e0d1b6; 
      padding: 9px 20px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      /* Warm Brown Text */
      color: #5d4037; 
      cursor: pointer;
      transition: all 0.2s ease;
    }
    /* Active/Hover State: Warm Gold/Caramel */
    .filter-btn.active, .filter-btn:hover {
      /* Caramel Brown Background */
      background-color: #a1887f; 
      border-color: #a1887f;
      color: #ffffff;
    }

    /* Menu Cards */
    .menu-card {
      /* Stark White Card */
      background: #ffffff; 
      border-radius: 16px;
      overflow: hidden;
      /* Soft shadows */
      box-shadow: 0 4px 15px rgba(121, 85, 72, 0.1); 
      margin-bottom: 20px;
      display: block;
      transition: opacity 0.3s ease;
    }
    .menu-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }
    .card-content {
      padding: 18px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
      /* Deep Rich Brown Title */
      color: #4e342e; 
    }

    /* Helper class to hide items when filtered */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🫖 The Warm Teapot & Bakery</h1>
      <p>A Cozy Selection Baked fresh & Brewed Daily</p>
    </div>

    <!-- Category Filter Buttons -->
    <div class="filter-container">
      <button class="filter-btn active" onclick="filterMenu('all')">All</button>
      <button class="filter-btn" onclick="filterMenu('drinks')">Drinks</button>
      <button class="filter-btn" onclick="filterMenu('pastries')">Pastries</button>
    </div>

    <!-- PASTRIES SECTION -->
    <div class="menu-card pastries">
      <img src="akaiw fatir.jpeg" alt="فطيره عكاوي">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">فطيره عكاوي</h2>
        </div>
      </div>
    </div>

    <div class="menu-card pastries">
      <img src="chips fatrai.jpeg" alt="فطيره شيبس">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">فطيره شيبس</h2>
        </div>
      </div>
    </div>

    <div class="menu-card pastries">
      <img src="peperion pizza.jpeg" alt="فطيره بيتزا ببروني">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">فطيره بيتزا ببروني</h2>
        </div>
      </div>
    </div>

    <div class="menu-card pastries">
      <img src="pizza normal.jpeg" alt="فطيره بيتزا">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">فطيره بيتزا</h2>
        </div>
      </div>
    </div>

    <div class="menu-card pastries">
      <img src="pizza vegtable.jpeg" alt="فطيره بيتزا خضار">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">فطيره بيتزا خضار</h2>
        </div>
      </div>
    </div>

    <div class="menu-card pastries">
      <img src="spiacnhe fatri.jpeg" alt="فطيره سبانخ">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">فطيره سبانخ</h2>
        </div>
      </div>
    </div>

    <!-- DRINKS SECTION -->
    <div class="menu-card drinks">
      <img src="coffe dala.jpeg" alt="دله قهوه">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">دله قهوه</h2>
        </div>
      </div>
    </div>

    <div class="menu-card drinks">
      <img src="kakate.jpeg" alt="كركديه">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">كركديه</h2>
        </div>
      </div>
    </div>

    <div class="menu-card drinks">
      <img src="ice tea peach.jpeg" alt="ايستي خوخ">
      <div class="card-content">
        <div class="item-header">
          <h2 class="item-title">ايستي خوخ</h2>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript Filter Logic -->
  <script>
    function filterMenu(category) {
      // Highlight active button
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Filter cards
      const cards = document.querySelectorAll('.menu-card');
      cards.forEach(card => {
        if (category === 'all') {
          card.classList.remove('hidden');
        } else {
          if (card.classList.contains(category)) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        }
      });
    }
  </script>

</body>
</html>
